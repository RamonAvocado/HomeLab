services:
  vault:
    container_name: vault
    image: hashicorp/vault:1.20
    command: server -config=/etc/vault/vault.hcl
    cap_add: [IPC_LOCK]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_API_ADDR: http://${HOST_IP}:8200
    ports:
      - "${HOST_IP:?set HOST_IP in .env}:8200:8200"
    volumes:
      - ./config:/etc/vault
      - vault-data:/vault/file
    networks: [homelab]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null; [ $$? -ne 1 ]"]
      interval: 30s

networks:
  homelab:
    name: homelab

volumes:
  vault-data:
